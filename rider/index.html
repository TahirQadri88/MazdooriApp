<!DOCTYPE html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>KT Rider App</title>

    <!-- PWA Manifest for Rider App -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1e3a8a" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KT Rider" />
    <link rel="apple-touch-icon" href="/MazdooriApp/icon-192.png" />

    <style>
      body { margin: 0; background: #1e3a8a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .msg { color: white; font-family: sans-serif; text-align: center; }
      .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="msg">
      <div class="spinner"></div>
      <div style="font-size:14px;font-weight:bold;letter-spacing:1px">Loading…</div>
    </div>
    <script>
      // Mark this session as rider-only mode, then load the main app
      localStorage.setItem('riderMode', '1');
      window.location.replace('/MazdooriApp/');
    </script>
  </body>
</html>
